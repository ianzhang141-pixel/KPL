<!doctype html>
<meta charset="utf-8">
<title>王者荣耀决策实验室 · 标定</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 24px 80px; background:#0f1216; color:#e6e9ef;
         font:14px/1.55 -apple-system,"PingFang SC",system-ui,sans-serif;
         font-variant-numeric: tabular-nums; }
  a { color:#7aa7ff; }
  h1 { font-size:19px; margin:0 0 3px; }
  .sub { color:#8b93a1; margin:0 0 16px; font-size:13px; }
  .wrap { display:grid; grid-template-columns: minmax(460px,1.3fr) minmax(340px,1fr);
          gap:16px; align-items:start; }
  @media (max-width:1000px){ .wrap{grid-template-columns:1fr;} }
  .card { background:#171b22; border:1px solid #232935; border-radius:10px; padding:16px 18px; }
  .card h2 { font-size:14px; margin:0 0 10px; }
  select, input { background:#0f1216; border:1px solid #2f3644; color:#e6e9ef;
                  border-radius:6px; padding:7px 9px; font:inherit; font-size:13px; width:100%; }
  label { display:block; color:#8b93a1; font-size:11px; margin:0 0 4px; }
  button { background:#3b82f6; border:1px solid #3b82f6; color:#fff; border-radius:6px;
           padding:8px 14px; font:inherit; font-size:13px; cursor:pointer; white-space:nowrap; }
  button.ghost { background:#232935; border-color:#2f3644; color:#e6e9ef; }
  button.sm { padding:5px 10px; font-size:12px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-bottom:9px; }
  .row > div { flex:1; min-width:80px; }
  .msg { margin-top:9px; font-size:13px; padding:9px 11px; border-radius:6px;
         display:none; white-space:pre-wrap; }
  .msg.ok { display:block; background:#0d2a17; border:1px solid #16663a; color:#86efac; }
  .msg.err{ display:block; background:#2a1113; border:1px solid #7a2a2f; color:#fca5a5; }
  .msg.warn{display:block; background:#2a2211; border:1px solid #7a5f2a; color:#fcd34d; }
  .stage { position:relative; display:inline-block; width:100%; user-select:none; }
  .stage img { width:100%; display:block; border-radius:8px; border:1px solid #232935;
               background:#000; }
  .box { position:absolute; border:2px solid #3b82f6; background:rgba(59,130,246,.14);
         pointer-events:none; }
  .box.mini { border-color:#f59e0b; background:rgba(245,158,11,.12); }
  .box b { position:absolute; top:-19px; left:-2px; font-size:10px; background:#3b82f6;
           color:#fff; padding:1px 5px; border-radius:3px; font-weight:600; white-space:nowrap; }
  .box.mini b { background:#f59e0b; }
  .dot { position:absolute; width:11px; height:11px; border-radius:50%;
         transform:translate(-50%,-50%); border:2px solid #0f1216; pointer-events:none; }
  .rlist { max-height:250px; overflow:auto; }
  .ritem { display:flex; justify-content:space-between; align-items:center; gap:8px;
           padding:6px 8px; border-bottom:1px solid #1c212a; font-size:12px; cursor:pointer; }
  .ritem:hover { background:#1b2029; }
  .ritem.on { background:#1e2a3d; }
  .ritem.done { color:#86efac; }
  .tip { color:#8b93a1; font-size:12px; border-left:3px solid #3b82f6; padding-left:10px;
         margin:10px 0 0; white-space:pre-wrap; }
  .strip { display:flex; gap:5px; overflow-x:auto; padding:8px 0 2px; }
  .strip button { padding:4px 9px; font-size:12px; background:#232935;
                  border-color:#2f3644; color:#c6ccd8; }
  .strip button.on { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px;
          border:1px solid #2f3644; color:#8b93a1; }
  .pill.on { border-color:#16663a; color:#86efac; background:#0d2a17; }
  .pill.off{ border-color:#7a2a2f; color:#fca5a5; background:#2a1113; }
</style>

<h1>标定 · 告诉系统「数字在画面的哪个位置」</h1>
<p class="sub"><a href="/">← 控制台</a> · <a href="/annotate">标注页</a> · <a href="/debug">核对页</a></p>

<div class="wrap">
  <div>
    <div class="card">
      <div class="row">
        <div style="flex:2"><label>比赛</label><select id="gameSel"></select></div>
        <div style="flex:0"><button class="ghost sm" onclick="loadFrames()">刷新</button></div>
      </div>
      <div class="row">
        <div><label>画面类型</label><select id="profileMode">
          <option value="player_pov">职业/顶尖选手单人视角</option>
          <option value="full_scoreboard">赛事转播固定记分板</option>
        </select></div>
      </div>
      <div class="strip" id="strip"></div>
      <div class="stage" id="stage">
        <img id="img" alt="">
        <div id="overlay"></div>
      </div>
      <p class="tip" id="hint">
先在右边点一个要标定的项目，然后<b>在图上按住鼠标拖一个框</b>把那个数字圈起来。
框要贴紧数字，多圈进来一些背景会让识别变差。
      </p>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>① 要标定的项目</h2>
      <div class="rlist" id="regions"></div>
      <div class="row" style="margin-top:10px">
        <div style="flex:0"><button onclick="saveProfile()">保存标定</button></div>
        <div style="flex:0"><button class="ghost" onclick="clearOne()">清掉当前项</button></div>
      </div>
      <div class="msg" id="saveMsg"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>② 小地图颜色调试 <span class="pill" id="mmPill">未标定</span></h2>
      <p class="tip" style="margin-top:0">
标好「小地图」那一项之后，点下面的按钮试一次。
系统会在图上把认出来的人用小圆点标出来。
<b>每方最多 5 个</b> —— 认出超过 5 个说明阈值太松，会被判为不可用。
      </p>
      <div class="row">
        <div><label>蓝 最低B</label><input type="number" id="blueMinB"></div>
        <div><label>蓝 B-R</label><input type="number" id="blueBOverR"></div>
        <div><label>蓝 B-G</label><input type="number" id="blueBOverG"></div>
      </div>
      <div class="row">
        <div><label>红 最低R</label><input type="number" id="redMinR"></div>
        <div><label>红 R-B</label><input type="number" id="redROverB"></div>
        <div><label>红 R-G</label><input type="number" id="redROverG"></div>
      </div>
      <div class="row">
        <div><label>最小像素</label><input type="number" id="minBlobPixels"></div>
        <div><label>最大像素</label><input type="number" id="maxBlobPixels"></div>
        <div style="flex:0"><button onclick="tryMinimap()">试一次</button></div>
      </div>
      <div class="msg" id="mmMsg"></div>
      <div class="row" style="margin-top:8px">
        <div style="flex:0"><button class="ghost" id="mmSave" onclick="saveMinimap()" disabled>
          结果对的话，标记为已标定</button></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let GAME='', FRAMES=[], CURRENT=null, REGIONS={}, ACTIVE=null, SPECS={}, LAST=null, PROFILES={};

function qs(k){ return new URLSearchParams(location.search).get(k)||''; }
async function api(p,b){ const o=b?{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(b)}:{}; return (await fetch(p,o)).json(); }
function fmt(s){ s=Math.max(0,Math.round(s));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function msg(id,t,k='ok'){ const e=$(id); e.className='msg '+k; e.textContent=t; if(!t) e.className='msg'; }

async function boot() {
  const st = await api('/api/status');
  SPECS = st.regionSpecs || {};
  PROFILES = st.profiles || {};
  loadProfileForMode();
  const mm = st.minimap || {};
  ['blueMinB','blueBOverR','blueBOverG','redMinR','redROverB','redROverG',
   'minBlobPixels','maxBlobPixels'].forEach(k => { if(mm[k]!==undefined) $(k).value = mm[k]; });
  $('mmPill').className = 'pill ' + (mm.verified?'on':'off');
  $('mmPill').textContent = mm.verified ? '已标定' : '未标定';

  const inv = await api('/api/games');
  const want = qs('game') || (inv.games[0]||{}).gameId || '';
  $('gameSel').innerHTML = inv.games.map(g =>
    `<option value="${g.gameId}" ${g.gameId===want?'selected':''}>${g.gameId}</option>`).join('');
  GAME = $('gameSel').value;
  renderRegions();
  if (GAME) loadFrames();
}
$('gameSel').addEventListener('change', ()=>{ GAME=$('gameSel').value; loadFrames(); });
$('profileMode').addEventListener('change', ()=>{
  ACTIVE=null; LAST=null; loadProfileForMode(); renderRegions();
});

function profileName(){ return $('profileMode').value==='player_pov' ? 'player_pov' : 'kpl_broadcast'; }
function loadProfileForMode(){
  const prof = PROFILES[profileName()] || {};
  REGIONS = Object.assign({}, prof.regions || {});
}

// 区域清单写死在前端，和 hud.REGIONS 对应。只列必需的 + 小地图，
// 十个人的等级框太琐碎，第一遍标定不做，等 OCR 真跑起来了再说。
const FULL_LIST = [
  ['clock','比赛计时','整条时间轴的锚点，这个错了所有帧都会错位'],
  ['blueGold','蓝方总经济','可能显示成 2.3万'],
  ['redGold','红方总经济',''],
  ['blueKills','蓝方击杀',''],
  ['redKills','红方击杀',''],
  ['minimap','小地图','十个人的位置。没有它就答不了「入侵值不值」'],
];
const POV_LIST = [
  ['clock','比赛计时','单人视角唯一强制项'],
  ['allyKills','己方击杀','不会在未确认阵营时冒充蓝方'],
  ['enemyKills','敌方击杀','不会在未确认阵营时冒充红方'],
  ['minimap','小地图','十个人的位置，需要另外核对颜色阈值'],
];
function currentList(){ return $('profileMode').value==='player_pov' ? POV_LIST : FULL_LIST; }
function renderRegions() {
  $('regions').innerHTML = currentList().map(([k,label,why]) => {
    const has = REGIONS[k];
    return `<div class="ritem ${ACTIVE===k?'on':''} ${has?'done':''}" onclick="pickRegion('${k}')">
      <span>${has?'✓':'○'} ${label}${why?`<br><span style="color:#5b6373">${why}</span>`:''}</span>
      <span style="color:#5b6373">${has?has.map(v=>v.toFixed(3)).join(', '):'未标'}</span>
    </div>`; }).join('');
  drawOverlay();
}
function pickRegion(k){ ACTIVE=k; renderRegions();
  $('hint').innerHTML = `正在标定：<b>${currentList().find(l=>l[0]===k)[1]}</b> —— 在图上拖一个框把它圈起来。`; }
function clearOne(){ if(ACTIVE){ delete REGIONS[ACTIVE]; renderRegions(); } }

async function loadFrames() {
  const res = await api('/api/frames/'+encodeURIComponent(GAME));
  FRAMES = res.frames || [];
  $('strip').innerHTML = FRAMES.map((f,i)=>
    `<button id="fb${i}" onclick="pickFrame(${i})">${fmt(f.atSec)}</button>`).join('')
    || '<span style="color:#8b93a1;font-size:12px">这场还没有抽出来的帧图。回控制台第 4 步抽帧。</span>';
  if (FRAMES.length) pickFrame(0);
  else { $('img').removeAttribute('src'); drawOverlay(); }
}
function pickFrame(i){
  CURRENT=FRAMES[i];
  $('img').src = `/frame?game=${encodeURIComponent(GAME)}&file=${encodeURIComponent(CURRENT.file)}`;
  FRAMES.forEach((_,j)=>{ const b=$('fb'+j); if(b) b.classList.toggle('on', i===j); });
  LAST=null; $('mmSave').disabled=true; msg('mmMsg','');
}

// ---- 拖框 ----
let dragging=false, sx=0, sy=0;
const stage=$('stage');
stage.addEventListener('mousedown', e=>{
  if(!ACTIVE || !$('img').getAttribute('src')) return;
  const r=$('img').getBoundingClientRect();
  dragging=true; sx=(e.clientX-r.left)/r.width; sy=(e.clientY-r.top)/r.height;
  e.preventDefault();
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const r=$('img').getBoundingClientRect();
  const cx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  const cy=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  REGIONS[ACTIVE]=[Math.min(sx,cx),Math.min(sy,cy),Math.abs(cx-sx),Math.abs(cy-sy)];
  drawOverlay();
});
window.addEventListener('mouseup', ()=>{
  if(!dragging) return;
  dragging=false;
  const b=REGIONS[ACTIVE];
  // 太小的框多半是误点，不要留下一个 0 宽的区域
  if(!b || b[2]<0.004 || b[3]<0.004){ delete REGIONS[ACTIVE]; }
  renderRegions();
});

function drawOverlay(){
  const parts=[];
  for(const [k,b] of Object.entries(REGIONS)){
    const spec=currentList().find(l=>l[0]===k);
    if(!spec) continue;
    parts.push(`<div class="box ${k==='minimap'?'mini':''}" style="left:${b[0]*100}%;top:${b[1]*100}%;
      width:${b[2]*100}%;height:${b[3]*100}%"><b>${spec[1]}</b></div>`);
  }
  if(LAST && LAST.usable && REGIONS.minimap){
    const m=REGIONS.minimap;
    for(const side of ['blue','red']) for(const d of LAST[side]){
      parts.push(`<div class="dot" style="left:${(m[0]+d.x*m[2])*100}%;
        top:${(m[1]+d.y*m[3])*100}%;background:${side==='blue'?'#3b82f6':'#ef4444'}"></div>`);
    }
  }
  $('overlay').innerHTML=parts.join('');
}

async function saveProfile(){
  const mode=$('profileMode').value;
  const res = await api('/api/profile', {name:profileName(), mode,
    label:mode==='player_pov'?'职业/顶尖选手单人视角':'KPL 赛事转播',
    note:'在标定页上对着真实画面标的', regions: REGIONS});
  if(!res.ok){ msg('saveMsg', res.error, 'err'); return; }
  PROFILES[profileName()]=res.profile;
  msg('saveMsg', res.verdict.message, res.verdict.ok?'ok':'warn');
}

async function tryMinimap(){
  if(!REGIONS.minimap){ msg('mmMsg','先标定「小地图」那一项。','err'); return; }
  if(!CURRENT){ msg('mmMsg','先选一张帧图。','err'); return; }
  const body = {gameId:GAME, file:CURRENT.file, box:REGIONS.minimap};
  ['blueMinB','blueBOverR','blueBOverG','redMinR','redROverB','redROverG',
   'minBlobPixels','maxBlobPixels'].forEach(k=>{ if($(k).value!=='') body[k]=$(k).value; });
  const res = await api('/api/minimap/detect', body);
  if(!res.ok){ msg('mmMsg', res.error, 'err'); LAST=null; drawOverlay(); return; }
  const r = res.result;
  LAST = {blue:r.blue, red:r.red, usable:r.quality.usable};
  drawOverlay();
  const head = `认出蓝方 ${r.blueCount} 个、红方 ${r.redCount} 个，置信度 ${r.quality.confidence}`;
  const body2 = r.quality.problems.length ? '\n' + r.quality.problems.map(p=>'· '+p).join('\n') : '';
  msg('mmMsg', head + body2, r.quality.usable ? 'ok' : 'err');
  $('mmSave').disabled = !r.quality.usable;
}

async function saveMinimap(){
  const t={};
  ['blueMinB','blueBOverR','blueBOverG','redMinR','redROverB','redROverG',
   'minBlobPixels','maxBlobPixels'].forEach(k=>{ if($(k).value!=='') t[k]=parseInt($(k).value,10); });
  const res = await api('/api/minimap/save', {thresholds:t, verified:true});
  if(!res.ok){ msg('mmMsg', res.error, 'err'); return; }
  $('mmPill').className='pill on'; $('mmPill').textContent='已标定';
  msg('mmMsg','已标记为已标定。换一个录像源（画质色调不同）可能要重标。','ok');
}

boot();
</script>
